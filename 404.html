<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Not found</title></head>
<body><script>
(function(){
  var path=location.pathname.replace(/\/+$/, '');
  if(path.indexOf('/epk/')===0){
    var parts=path.split('/').filter(Boolean);
    var slug=parts[1]||'';
    if(slug){ location.replace('/epk/?artist='+encodeURIComponent(slug)); return; }
  }
  document.body.innerHTML='<h1>Page not found</h1>';
})();
</script></body></html>
