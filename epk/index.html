function epkApplySectionOrder(doc,c){

       has(el,'bio-card')||has(el,'bio-block')||has(el,'bio-row')||has(el,'sound')||

(async function(){
const root=document.getElementById('app'),slug=pkSlug();

if(!slug){
diagnosticState('NO_SLUG','Press kit unavailable','No artist slug was found in the URL.');
return;
}

let rows;

try{
rows=await api('published_epk_public?select=*&public_slug=eq.'+encodeURIComponent(slug)+'&limit=1');
}catch(e){
diagnosticState(
'SUPABASE_HTTP_ERROR',
'Press kit unavailable',
'Supabase request failed.'+
(e.status?' HTTP '+e.status+'.':'')+
(e.message?'\n\n'+e.message:'')+
(e.responseBody?'\n\n'+e.responseBody:'')
);
return;
}

if(!rows.length){
diagnosticState('NO_PUBLISHED_ROW','Press kit unavailable','No published EPK row was returned for slug: '+slug);
return;
}

const row=rows[0],pk={template:row.template,theme:row.theme,content:row.content},artist={name:row.artist_name||'Artist'};

if(!pk.template||!EPK_TEMPLATE_SOURCES[pk.template]){
diagnosticState('TEMPLATE_MISSING','Press kit unavailable','No EPK template source was found for template: '+String(pk.template||'(missing)'));
return;
}

let doc;

try{
doc=build(pk,artist);
}catch(e){
diagnosticState('BUILD_FAILED','Press kit unavailable','The EPK document failed while being built.\n\n'+(e&&e.stack?e.stack:String(e)));
return;
}

if(!doc){
diagnosticState('BUILD_FAILED','Press kit unavailable','The EPK build returned an empty document for template: '+String(pk.template||'(missing)'));
return;
}

try{
const blob=new Blob([doc],{type:'text/html'}),url=URL.createObjectURL(blob);
root.innerHTML='<iframe class="frame" title="'+esc(artist.name)+' press kit"></iframe>';
root.querySelector('iframe').src=url;
document.title=artist.name+' · Press Kit';
}catch(e){
diagnosticState('BUILD_FAILED','Press kit unavailable','The built EPK could not be rendered.\n\n'+(e&&e.stack?e.stack:String(e)));
}
})(); </script></body></html>
