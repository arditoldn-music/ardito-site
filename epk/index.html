function epkApplySectionOrder(doc,c){
  const body=doc.body;

  const hasAchievements=!!String(c.achievements||'').trim();

  const norm=s=>String(s||'').replace(/\s+/g,' ').trim().toLowerCase();
  const classes=el=>el&&el.classList?el.classList:null;
  const has= (el,name)=>!!(classes(el)&&classes(el).contains(name));
  const textOfDirectLabel=el=>{
    const label=direct(el).find(ch=>has(ch,'label')||has(ch,'block-title'));

  };
  const rowLabel=el=>{
    const n=direct(el).find(ch=>has(ch,'row-num'));
    return norm(n&&n.textContent||'');
  };

  /*
   * Section ordering is deliberately conservative:
   * only direct children of an authored section host are eligible to move.
   * Nested cards, headings, images, paragraphs, etc. are never selected.
   */
  const isPotentialUnit=el=>{
    if(!el)return false;
    if(el.hasAttribute('data-epk-track'))return true;
    if(has(el,'hero')||has(el,'hero-row')||has(el,'hero-card')||has(el,'headline-block')||
       has(el,'name-row')||has(el,'name-block')||has(el,'header')||has(el,'bio')||
       has(el,'bio-card')||has(el,'bio-block')||has(el,'bio-row')||has(el,'sound')||
       has(el,'track-card')||has(el,'track-block')||has(el,'elsewhere')||has(el,'links-card')||
       has(el,'links-line')||has(el,'press')||has(el,'press-card')||has(el,'press-block')||
       has(el,'press-quote')||has(el,'quote-block')||has(el,'quote-card')||has(el,'stats')||
       has(el,'row'))return true;
    if(has(el,'card'))return true;
    if(has(el,'dark-card'))return true;
    return false;
  };

  let pairUnits=null;

   * index-dossier is a two-column grid made from alternating rail-label /
   * content-cell siblings. Its section wrapper is the pair, not either
   * individual cell.
   */
  const bodyKids=direct(body);
  if(bodyKids.length>=2){
    const pairs=[];

      const a=bodyKids[i],b=bodyKids[i+1];
      if(has(a,'rail-label')&&has(b,'content-cell')){
        const label=norm(a.textContent);
        let key=null;
        if(label==='artist')key='short_bio';
        else if(label==='bio')key='bio';
        else if(label==='track')key='releases';
        else if(label==='press')key='quote';
        else if(label==='elsewhere')key='links';
        else if(/highlight|achievement/.test(label))key='achievements';
        pairs.push({key,nodes:[a,b],parent:body});
        i++;

    }
    if(pairs.length>=2)pairUnits=pairs;
  }

  if(!pairUnits){

    const directByClass=(parent,name)=>direct(parent).find(el=>has(el,name));
    const usable=parent=>direct(parent).filter(isPotentialUnit).length>=2;

    const content=directByClass(body,'content');
    if(content&&usable(content)){
      host=content;
    }else{
      const page=directByClass(body,'page');
      if(page){
        const inner=directByClass(page,'inner');
        if(inner&&usable(inner))host=inner;
        else if(usable(page))host=page;
      }
      if(!host){
        const layout=directByClass(body,'layout');
        const main=layout&&directByClass(layout,'main');
        if(main&&usable(main))host=main;
      }
      if(!host){
        const column=directByClass(body,'column');
        if(column&&usable(column))host=column;
      }
      if(!host){
        const wrap=directByClass(body,'wrap');

      }

    if(key==='short_bio')return rl==='01 artist'||/^01\s+artist\b/.test(rl);
    if(key==='bio')return rl==='02 bio'||/^02\s+bio\b/.test(rl);
    if(key==='releases')return rl==='03 track'||/^03\s+track\b/.test(rl);
    if(key==='quote')return /^04\s+press\b/.test(rl);
    if(key==='links')return /^08\s+elsewhere\b/.test(rl)||/\belsewhere\b/.test(rl);
    return false;

        has(el,'name-row')||has(el,'name-block')||
        (has(el,'header')&&!!el.querySelector('.hook'))||
        (has(el,'row')&&(labelMatches(el,key)||!!el.querySelector('.artist-name')));
    }

      return has(el,'bio')||has(el,'bio-card')||has(el,'bio-block')||has(el,'bio-row')||
        (has(el,'card')&&textOfDirectLabel(el)==='about')||
        (has(el,'row')&&(labelMatches(el,key)||!!el.querySelector('.bio-row')));
    }
    if(key==='releases'){
      return el.hasAttribute('data-epk-track')||has(el,'track-card')||has(el,'track-block')||has(el,'sound')||
        (has(el,'row')&&labelMatches(el,key));
    }
    if(key==='links'){
      return has(el,'epk-runtime-social')||has(el,'elsewhere')||has(el,'links-card')||has(el,'links-line')||
        (has(el,'card')&&/listen\s*(?:&|and)\s*follow/i.test(textOfDirectLabel(el)))||
        (has(el,'dark-card')&&/listen\s*(?:&|and)\s*follow/i.test(textOfDirectLabel(el)))||
        (has(el,'row')&&labelMatches(el,key));
    }
    if(key==='quote'){
      return has(el,'press')||has(el,'press-card')||has(el,'press-block')||has(el,'press-quote')||
        has(el,'quote-block')||has(el,'quote-card')||

    }else if(key==='releases'){
      if(el.hasAttribute('data-epk-track'))s+=150;
      if(has(el,'track-card')||has(el,'track-block')||has(el,'sound'))s+=120;
      if(has(el,'row')&&labelMatches(el,key))s+=140;
    }else if(key==='links'){
      if(has(el,'epk-runtime-social'))s+=160;
      if(has(el,'row')&&/^08\s+elsewhere\b/.test(rowLabel(el)))s+=150;
      if(has(el,'elsewhere')||has(el,'links-card')||has(el,'links-line'))s+=120;
      if((has(el,'card')||has(el,'dark-card'))&&/listen\s*(?:&|and)\s*follow/i.test(textOfDirectLabel(el)))s+=110;
    }else if(key==='quote'){
      if(has(el,'press')||has(el,'press-card')||has(el,'press-block')||has(el,'press-quote')||has(el,'quote-block')||has(el,'quote-card'))s+=120;
      if(has(el,'row')&&labelMatches(el,key))s+=140;
      if(has(el,'card')&&!!el.querySelector('.quote'))s+=110;
    }else if(key==='achievements'){
      if(el.hasAttribute('data-epk-achievements'))s+=150;
      if(has(el,'stats'))s+=140;
      if(/highlight|achievement/i.test(String(el.className||'')))s+=120;
    }
    return s;
  };

  if(pairUnits){
    if(hasAchievements&&!pairUnits.some(u=>u.key==='achievements')){
      const label=doc.createElement('div');
      label.className='rail-label';
      label.textContent='Highlights';
      const cell=doc.createElement('div');
      cell.className='content-cell epk-runtime-section epk-runtime-achievements';
      cell.innerHTML=String(c.achievements).split(/\n+/).filter(Boolean).map(x=>'<p>'+esc(x)+'</p>').join('');
      const runtime={key:'achievements',nodes:[label,cell],parent:body,runtime:true};
      const contactIndex=pairUnits.findIndex(u=>u.nodes[0]&&/contact/i.test(norm(u.nodes[0].textContent)));
      if(contactIndex>=0){
        const before=pairUnits[contactIndex].nodes[0];
        body.insertBefore(label,before);
        body.insertBefore(cell,before);
      }else{
        body.appendChild(label);
        body.appendChild(cell);
      }
      pairUnits.push(runtime);
    }
    if(!hasAchievements){
      const native=pairUnits.find(u=>u.key==='achievements');
      if(native){native.nodes.forEach(n=>n.remove());pairUnits=pairUnits.filter(u=>u!==native);}

      host.insertBefore(sec,anchor||null);

      if(native)native.remove();
      units=direct(host).map(node=>({key:null,nodes:[node],parent:host,node}));
    }

    const selected=[];
    const used=new Set();
    order.forEach(key=>{
      let best=null,bestScore=-1;
      units.forEach(unit=>{

      if(best){

    const marker=doc.createComment('epk-section-order');
    const first=selected.reduce((earliest,u)=>{
      const n=u.nodes[0];
      if(!earliest)return n;
      const pos=earliest.compareDocumentPosition(n);
      return pos&Node.DOCUMENT_POSITION_FOLLOWING?earliest:n;

    if(!first||first.parentElement!==host)return;
    host.insertBefore(marker,first);
    selected.forEach(u=>u.nodes.forEach(n=>host.insertBefore(n,marker)));
    marker.remove();
    return;
  }

  const selected=[];
  const used=new Set();
  order.forEach(key=>{
    let best=null,bestScore=-1;
    pairUnits.forEach(unit=>{
      if(used.has(unit))return;
      if(unit.key!==key)return;
      if(unit.nodes.some(n=>!n.isConnected||n.parentElement!==body))return;

  });

  if(selected.length<2)return;

  const marker=doc.createComment('epk-section-order');
  const first=selected.reduce((earliest,u)=>{
    const n=u.nodes[0];
    if(!earliest)return n;
    const pos=earliest.compareDocumentPosition(n);
    return pos&Node.DOCUMENT_POSITION_FOLLOWING?earliest:n;
  },null);
  if(!first||first.parentElement!==body)return;
  body.insertBefore(marker,first);
  selected.forEach(u=>u.nodes.forEach(n=>body.insertBefore(n,marker)));
  marker.remove();
}

}

}catch(e){

(e.responseBody?'\n\n'+e.responseBody:'')
);

}

}

{const OPARGS={c:{...DEFAULTS,...(pk.content||{})},name:artist.name,template:pk.template,colors:{...(PK_DEFAULT_COLORS[pk.template]||PK_DEFAULT_COLORS['ardito-signature']||{}),...((pk.theme&&pk.theme[pk.template])||{})}};doc=RELEASE?epkReleaseSheetHtml(OPARGS):ONEPAGE?epkOnePagerHtml(OPARGS):build(pk,artist);}
